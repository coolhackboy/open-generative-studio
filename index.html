<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>__BRAND_NAME__ — AI image &amp; video studio</title>
    <meta name="description" content="A self-hostable, open-source AI image and video studio. Bring your own PoYo API key and generate with Seedance, Kling, FLUX, Nano Banana and more, straight from your browser." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="__BRAND_NAME__" />
    <meta property="og:description" content="Open-source AI image &amp; video studio. Bring your own PoYo API key — your works, your browser." />
    <meta property="og:image" content="/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      html { background: #0a0a0b; }
      @media (prefers-color-scheme: light) { html:not([data-theme='dark']) { background: #fafaf9; } }
      html[data-theme='light'] { background: #fafaf9; }
      .boot { position: fixed; left: 50%; bottom: 20px; width: min(820px, calc(100% - 32px)); height: 104px; transform: translateX(-50%); border-radius: 16px; border: 1px solid rgb(127 127 127 / 0.16); background: rgb(127 127 127 / 0.06); }
    </style>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('ui.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><div class="boot" aria-hidden="true"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
